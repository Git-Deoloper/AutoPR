[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localclaw"
version = "0.1.1"
description = "The local Ollama code assistant maintained in the AutoPR repository"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AutoPR / LocalClaw contributors"}]
keywords = ["ai", "code", "ollama", "local", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0,<3",
    "rich>=13.7.0,<16",
    "fastapi>=0.109.0,<1",
    "uvicorn>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
    "click>=8.1.0,<9",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
localclaw = "localclaw.cli.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.4,<10", "httpx>=0.27,<1", "pytest-cov>=4", "build>=1", "black>=23", "isort>=5", "flake8>=6", "mypy>=1.7"]

[project.urls]
Homepage = "https://github.com/Git-Deoloper/AutoPR"
Documentation = "https://github.com/Git-Deoloper/AutoPR#readme"
Repository = "https://github.com/Git-Deoloper/AutoPR.git"
Issues = "https://github.com/Git-Deoloper/AutoPR/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["localclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
